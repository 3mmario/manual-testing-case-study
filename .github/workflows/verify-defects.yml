name: verify-defects

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Fails the build if a reported defect can no longer be reproduced (the site changed, the report is stale).
      - name: Re-verify defects and capture evidence
        run: node scripts/verify-bugs.js

      # Re-executes all 41 test cases and rebuilds CSV / Markdown / XLSX / summary from the real results.
      - name: Execute test cases
        if: ${{ always() }}
        run: node scripts/run-cases.js
      - name: Build test documents
        if: ${{ always() }}
        run: node scripts/build-docs.js

      - name: Upload evidence and results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-and-results
          path: |
            docs/evidence/
            test-cases/results.json
            test-cases/test-cases.xlsx
            docs/06-test-summary-report.md
